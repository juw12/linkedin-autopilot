<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn Autopilot</title>
<meta name="theme-color" content="#0a66c2">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root {
    --bg: #f3f2ef; --card: #fff; --ink: #1d2226; --muted: #5e6b75; --line: #e3e6e8;
    --blue: #0a66c2; --blue-soft: #e8f3ff; --green: #057642; --green-soft: #e6f4ea;
    --amber: #915907; --amber-soft: #fdf3e1; --red: #b42318; --red-soft: #fdecea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header.top { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 18px; }
  .brand { margin: 0; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .logo { width: 28px; height: 28px; display: block; }
  nav { display: flex; gap: 2px; min-width: 0; }
  nav button { border: 0; background: none; padding: 8px 12px; border-radius: 6px; font: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; }
  nav button:hover { background: #f1f3f4; color: var(--ink); }
  nav button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  nav button[aria-selected="true"] { color: var(--blue); background: var(--blue-soft); font-weight: 600; }
  .updated { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  @media (max-width: 760px) {
    .bar { flex-wrap: wrap; gap: 4px 12px; padding: 8px 14px 0; }
    .brand { font-size: 15px; }
    nav { order: 3; flex: 1 0 100%; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px 6px; }
    nav::-webkit-scrollbar { display: none; }
    nav button { min-height: 40px; padding: 8px 11px; }
    main { padding: 14px; }
  }
  main { max-width: 1180px; margin: 0 auto; padding: 20px; }
  section[hidden] { display: none; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  h3 { font-size: 15px; margin: 0 0 10px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); margin-bottom: 18px; }
  .card { background: var(--card); border-radius: 10px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .value { font-size: 26px; font-weight: 700; margin-top: 2px; }
  .kpi .note { color: var(--muted); font-size: 12px; }
  .wide { grid-column: 1 / -1; }
  .two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); margin-bottom: 18px; }
  .next { border-left: 5px solid var(--blue); }
  .next .when { font-weight: 600; color: var(--blue); }
  .next .title { font-size: 20px; font-weight: 700; margin: 2px 0; }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 12px; font-size: 12px; font-weight: 600; background: var(--blue-soft); color: var(--blue); }
  .badge.good { background: var(--green-soft); color: var(--green); }
  .badge.warn { background: var(--amber-soft); color: var(--amber); }
  .badge.bad { background: var(--red-soft); color: var(--red); }
  .badge.grey { background: #eef0f2; color: var(--muted); }
  .post { background: var(--card); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); border-left: 5px solid var(--blue); }
  .post.auto, .post.cap { border-left-color: #a9b3ba; background: #fafafa; }
  .post.event { border-left-color: var(--green); }
  .post .head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
  .post .when { font-weight: 600; }
  .post .num { display: inline-block; min-width: 26px; text-align: center; background: var(--ink); color: #fff; border-radius: 4px; margin-right: 8px; font-size: 12px; }
  .post h4 { margin: 6px 0 0; font-size: 16px; }
  .post .hook { color: #38434f; margin: 2px 0 8px; }
  .thumbs { display: flex; gap: 8px; overflow-x: auto; }
  .thumbs img { flex: none; width: 170px; height: 96px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: #eef0f2; }
  details summary { cursor: pointer; color: var(--blue); font-weight: 600; margin-top: 8px; }
  pre.text { white-space: pre-wrap; font: inherit; background: #f8f9fa; padding: 12px; border-radius: 6px; margin: 8px 0 0; }
  table { width: 100%; border-collapse: collapse; }
  .scroll { overflow-x: auto; }
  .scroll table { min-width: 720px; }
  .scroll td:first-child { white-space: nowrap; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.quiet td { color: var(--muted); }
  tr.quiet td a { color: var(--muted); }
  .empty { color: var(--muted); padding: 18px; text-align: center; background: #fafafa; border-radius: 8px; }
  .hint { color: var(--muted); font-size: 13px; }
  .hint code { background: #eef0f2; padding: 1px 5px; border-radius: 4px; }
  svg.chart { width: 100%; height: auto; }
  svg.chart .axis { stroke: var(--line); }
  svg.chart .line { fill: none; stroke: var(--blue); stroke-width: 2.5; }
  svg.chart .dot { fill: var(--blue); }
  svg.chart text { fill: var(--muted); font-size: 11px; }
  .rank { display: grid; grid-template-columns: 150px 1fr 60px; gap: 8px; align-items: center; padding: 4px 0; }
  .rank .track { background: #eef0f2; border-radius: 4px; height: 12px; overflow: hidden; }
  .rank .fill { background: var(--blue); height: 100%; }
  .log { font: 12px/1.6 Consolas, monospace; white-space: pre-wrap; margin: 0; max-height: 70vh; overflow: auto; }
  .log .t { color: var(--muted); }
  .log .w { color: var(--amber); }
  .log .e { color: var(--red); }
  a { color: var(--blue); }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1 class="brand"><img class="logo" src="/icon.svg" alt="" width="28" height="28">LinkedIn Autopilot</h1>
    <nav role="tablist">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="schedule">Schedule</button>
      <button role="tab" data-tab="reach">Posts &amp; reach</button>
      <button role="tab" data-tab="github">GitHub &amp; clicks</button>
      <button role="tab" data-tab="learning">Learning</button>
      <button role="tab" data-tab="log">Log</button>
    </nav>
    <span class="updated" id="updated">Loading…</span>
  </div>
</header>

<main>
  <section id="overview"></section>
  <section id="schedule" hidden></section>
  <section id="reach" hidden></section>
  <section id="github" hidden></section>
  <section id="learning" hidden></section>
  <section id="log" hidden></section>
</main>

<script>
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (value) => (value === null || value === undefined ? "–" : Number(value).toLocaleString());
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function niceDate(stamp) {
  if (!stamp) return "–";
  const [date, time] = stamp.split(" ");
  const [y, m, d] = date.split("-").map(Number);
  const day = new Date(y, m - 1, d);
  return `${DAYS[day.getDay()]} ${d} ${MONTHS[m - 1]}` + (time ? ` · ${time}` : "");
}

const KIND = {
  prepared: ["Prepared post", ""],
  event: ["New on GitHub", "good"],
  drafted: ["Drafted", "warn"],
  auto: ["Picked on the day", "grey"],
  cap: ["Weekly limit", "grey"],
};
const STATUS = { posted: "good", ready: "warn", awaiting_approval: "warn", failed: "bad", skipped: "grey" };

function lineChart(series, emptyText) {
  if (!series.length) return `<div class="empty">${esc(emptyText)}</div>`;
  const W = 520, H = 170, L = 36, R = 14, T = 14, B = 26;
  const max = Math.max(1, ...series.map((p) => p.y));
  const x = (i) => L + (series.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (series.length - 1));
  const y = (v) => H - B - (v * (H - T - B)) / max;
  const points = series.map((p, i) => `${x(i)},${y(p.y)}`).join(" ");
  const dots = series.map((p, i) => `<circle class="dot" cx="${x(i)}" cy="${y(p.y)}" r="3.5"><title>${esc(p.x)}: ${num(p.y)}</title></circle>`).join("");
  const first = series[0].x, last = series[series.length - 1].x;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <line class="axis" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/>
    <line class="axis" x1="${L}" y1="${T}" x2="${W - R}" y2="${T}" stroke-dasharray="3 4"/>
    <text x="${L - 6}" y="${T + 4}" text-anchor="end">${num(max)}</text>
    <text x="${L - 6}" y="${H - B + 4}" text-anchor="end">0</text>
    ${series.length > 1 ? `<polyline class="line" points="${points}"/>` : ""}${dots}
    <text x="${L}" y="${H - 6}">${esc(niceDate(first))}</text>
    ${series.length > 1 ? `<text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(niceDate(last))}</text>` : ""}
  </svg>`;
}

function kpi(label, value, note = "") {
  return `<div class="card kpi"><div class="label">${esc(label)}</div><div class="value">${value}</div><div class="note">${note}</div></div>`;
}

function postCard(entry, index) {
  const [kindLabel, kindClass] = KIND[entry.kind] || [entry.kind, ""];
  const thumbs = entry.images.length ? `<div class="thumbs">${entry.images.map((src) => `<img src="${esc(src)}" alt="" loading="lazy">`).join("")}</div>` : "";
  const full = entry.body
    ? `<details><summary>Full post text</summary><pre class="text">${esc(entry.body)}</pre>${entry.comment ? `<div class="hint" style="margin-top:8px"><b>First comment</b></div><pre class="text">${esc(entry.comment)}</pre>` : ""}</details>`
    : "";
  return `<article class="post ${esc(entry.kind)}">
    <div class="head">
      <div class="when"><span class="num">${index + 1}</span>${esc(niceDate(entry.slot))} WIB</div>
      <div><span class="badge ${kindClass}">${esc(kindLabel)}</span> ${entry.angle && entry.angle !== "auto" && entry.angle !== "-" ? `<span class="badge grey">${esc(entry.angle)}</span>` : ""}</div>
    </div>
    <h4>${esc(entry.title)}</h4>
    <p class="hook">${esc(entry.hook)}</p>
    ${thumbs}${full}
  </article>`;
}

function renderOverview(d) {
  const o = d.overview;
  const next = o.next_post;
  const tokenNote = o.token_days_left === null ? "Not connected: python autopilot.py auth" : o.token_days_left < 7 ? "Renew soon: python autopilot.py auth" : "Connected";
  const tokenBadge = o.token_days_left === null ? "bad" : o.token_days_left < 7 ? "warn" : "good";
  const state = o.paused ? `<span class="badge warn">Paused</span>` : `<span class="badge good">Running</span>`;
  document.getElementById("overview").innerHTML = `
    <div class="grid">
      <div class="card next wide">
        ${next ? `<div class="when">Next post · ${esc(niceDate(next.slot))} WIB</div>
          <div class="title">${esc(next.title)}</div>
          <div class="hint">${esc(next.hook)}</div>` : `<div class="hint">Nothing scheduled.</div>`}
      </div>
      ${kpi("Status", state, `Mode: ${esc(o.mode)} · last run ${esc(o.last_tick ? niceDate(o.last_tick) : "–")}`)}
      ${kpi("This week", `${o.posts_this_week} / ${o.max_per_week}`, `Slots: ${esc(o.slots.join(", "))} WIB`)}
      ${kpi("Posted", num(o.posted_total), o.failed_total ? `<span class="badge bad">${o.failed_total} failed</span>` : "All good")}
      ${kpi("Prepared posts left", num(o.prepared_left), "Then the bot writes them itself")}
      ${kpi("LinkedIn login", o.token_days_left === null ? "–" : `${o.token_days_left} days`, `<span class="badge ${tokenBadge}">${esc(tokenNote)}</span>`)}
      ${kpi("Click tracking", o.click_tracking ? "On" : "Off", o.click_tracking ? "GoatCounter counts “Try it” clicks" : "Run: python autopilot.py goatcounter")}
    </div>
    <div class="two">
      <div class="card"><h3>GitHub stars (all projects)</h3>${lineChart(d.github.stars_series, "Collected daily from tomorrow on.")}</div>
      <div class="card"><h3>“Try it” clicks per day</h3>${lineChart(d.github.clicks_series, "No clicks yet. They start once posts go out.")}</div>
    </div>`;
}

function renderSchedule(d) {
  const items = d.schedule;
  document.getElementById("schedule").innerHTML = `
    <h2>Upcoming posts</h2>
    <p class="hint">Every post goes out at the slot time, with links in the first comment. Prepared posts are fixed. “Picked on the day” is decided at 08:00 from what's new on GitHub and what has performed best so far.</p>
    ${items.length ? items.map(postCard).join("") : `<div class="empty">Nothing scheduled.</div>`}`;
}

function renderReach(d) {
  const o = d.overview;
  const posted = d.history.filter((p) => p.status === "posted");
  const rate = o.impressions ? ((o.engagements / o.impressions) * 100).toFixed(1) + "%" : "–";
  const visitors = posted.reduce((sum, p) => sum + (p.visitors || 0), 0);
  const stars = posted.reduce((sum, p) => sum + (p.stars || 0), 0);
  const rows = d.history.map((p) => `<tr>
      <td>${esc(niceDate(p.slot))}</td>
      <td><b>${esc(p.title)}</b><div class="hint">${esc(p.hook)}</div>${p.error ? `<div class="badge bad" title="${esc(p.error)}">Error: ${esc(p.error.slice(0, 80))}</div>` : ""}</td>
      <td><span class="badge ${STATUS[p.status] || "grey"}">${esc(p.status)}</span></td>
      <td class="num">${num(p.impressions)}</td>
      <td class="num">${num(p.engagements)}</td>
      <td class="num">${num(p.visitors)}</td>
      <td class="num">${num(p.stars)}</td>
      <td class="num">${num(p.try_clicks)}</td>
      <td>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">Open</a>` : ""}</td>
    </tr>`).join("");
  document.getElementById("reach").innerHTML = `
    <div class="grid">
      ${kpi("Posts published", num(posted.length))}
      ${kpi("Impressions", o.posts_with_linkedin_stats ? num(o.impressions) : "–", "From your LinkedIn export")}
      ${kpi("Engagement rate", rate, "Reactions, comments, reposts, clicks")}
      ${kpi("GitHub visitors from LinkedIn", num(visitors), "Within 2 weeks of each post")}
      ${kpi("Stars after posts", num(stars), "Gained in the week after")}
      ${kpi("“Try it” clicks (30 days)", num(d.github.clicks_30d_total))}
    </div>
    <div class="card" style="margin-bottom:18px">
      <h3>Every post</h3>
      ${d.history.length ? `<div class="scroll"><table>
        <thead><tr><th>Slot</th><th>Post</th><th>Status</th><th class="num">Impressions</th><th class="num">Engagements</th><th class="num">GitHub visitors</th><th class="num">Stars</th><th class="num">Try-it clicks</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>` : `<div class="empty">Nothing posted yet. The first post goes out ${esc(o.next_post ? niceDate(o.next_post.slot) : "soon")} WIB.</div>`}
    </div>
    <div class="card">
      <h3>Where reach numbers come from</h3>
      <p class="hint">LinkedIn doesn't let apps read impressions for personal profiles, so GitHub visitors, stars and “Try it” clicks are measured automatically.
      To add LinkedIn's own impressions and engagements: open your LinkedIn post analytics, export to Excel, and save the file in
      <code>${esc(o.inbox)}</code>. The bot imports it within 30 minutes, and its numbers then take priority over the GitHub-based score.</p>
    </div>`;
}

function renderGithub(d) {
  const g = d.github;
  const activity = (r) => (r.stars || 0) + (r.li_uniques || 0) + (r.li_views || 0) + (r.clicks_30d || 0) + (r.posts || 0);
  const repos = [...g.repos].sort((a, b) => (activity(b) > 0) - (activity(a) > 0));
  const rows = repos.map((r) => `<tr class="${activity(r) ? "" : "quiet"}">
      <td><a href="https://github.com/juw12/${esc(r.repo)}" target="_blank" rel="noopener">${esc(r.repo)}</a></td>
      <td class="num">${num(r.stars)}</td>
      <td class="num">${num(r.li_uniques)}</td>
      <td class="num">${num(r.li_views)}</td>
      <td class="num">${num(r.clicks_30d)}</td>
      <td class="num">${num(r.posts)}</td>
      <td>${esc(r.last_posted ? niceDate(r.last_posted) : "–")}</td>
    </tr>`).join("");
  document.getElementById("github").innerHTML = `
    <div class="two">
      <div class="card"><h3>Visitors from LinkedIn (14-day window)</h3>${lineChart(g.visitors_series, "Collected daily.")}</div>
      <div class="card"><h3>“Try it” clicks per day</h3>${lineChart(g.clicks_series, "No clicks yet.")}</div>
    </div>
    <div class="card">
      <h3>Projects ${g.latest_day ? `<span class="hint">· snapshot ${esc(niceDate(g.latest_day))}</span>` : ""}</h3>
      ${g.repos.length ? `<div class="scroll"><table>
        <thead><tr><th>Project</th><th class="num">Stars</th><th class="num">LinkedIn visitors</th><th class="num">LinkedIn views</th><th class="num">Try-it clicks (30d)</th><th class="num">Posts</th><th>Last posted</th></tr></thead>
        <tbody>${rows}</tbody></table></div>` : `<div class="empty">No GitHub data yet.</div>`}
      <p class="hint">LinkedIn visitors and views are GitHub's referrer counts over the last 14 days. Clicks come from the tracked “Try it” links.</p>
    </div>`;
}

function rankList(items) {
  if (!items.length) return `<div class="empty">Nothing to rank yet.</div>`;
  const max = Math.max(...items.map((i) => i.score), 0.1);
  return items.map((i) => `<div class="rank"><div>${esc(i.name)}</div>
      <div class="track"><div class="fill" style="width:${(i.score / max) * 100}%"></div></div>
      <div class="num hint">${i.score}%</div></div>`).join("");
}

function renderLearning(d) {
  const l = d.learning;
  document.getElementById("learning").innerHTML = `
    <div class="card" style="margin-bottom:18px">
      <h3>How the bot decides</h3>
      <p class="hint">After each post it measures the result: LinkedIn numbers if you've exported them, otherwise GitHub visitors, “Try it” clicks and stars (one star counts as three visitors).
      Projects and post styles that do better get picked more often, but untested ones still get a fair chance.
      ${l.records ? `It has learned from <b>${l.records}</b> post${l.records === 1 ? "" : "s"} so far.` : "Learning starts about 3 days after the first post."}</p>
    </div>
    <div class="two">
      <div class="card"><h3>Projects</h3>${rankList(l.repo)}</div>
      <div class="card"><h3>Post styles</h3>${rankList(l.angle)}</div>
    </div>`;
}

function renderLog(d) {
  const lines = d.log.map((line) => {
    const cls = / (ERROR|CRITICAL) /.test(line) ? "e" : / WARNING /.test(line) ? "w" : "";
    const stamp = line.match(/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d(,\d+)?/);
    const rest = stamp ? line.slice(stamp[0].length) : line;
    return `<span class="${cls}">${stamp ? `<span class="t">${esc(stamp[0].slice(5, 16))}</span>` : ""}${esc(rest)}</span>`;
  }).join("\n");
  document.getElementById("log").innerHTML = `<div class="card"><h3>Recent activity <span class="hint">(newest first)</span></h3><pre class="log">${lines || "No log yet."}</pre></div>`;
}

async function load() {
  try {
    const response = await fetch("/api/data", { cache: "no-store" });
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    renderOverview(data);
    renderSchedule(data);
    renderReach(data);
    renderGithub(data);
    renderLearning(data);
    renderLog(data);
    document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } catch (error) {
    document.getElementById("updated").textContent = "Couldn't load data: " + error.message;
  }
}

document.querySelectorAll("nav button").forEach((button) => {
  button.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-selected", String(b === button)));
    document.querySelectorAll("main section").forEach((s) => (s.hidden = s.id !== button.dataset.tab));
  });
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
